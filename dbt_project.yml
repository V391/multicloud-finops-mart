name: finops_mart
version: "1.0.0"
config-version: 2
profile: finops_mart

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Tolerance for reconciliation tests, in billing currency.
  reconcile_tolerance: 0.005

models:
  finops_mart:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table

seeds:
  finops_mart:
    tag_key_map:
      +column_types:
        raw_key: varchar
        canonical_key: varchar
        priority: integer
        note: varchar
